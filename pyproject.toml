[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "aitp-verifier"
version = "0.1.0"
description = "Independent Python implementation of the AITP verification core (second implementation for spec Final promotion)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Floors are set so the oldest supported install carries no known OSV
# advisory, and CI's `floors` job holds them to it. This is hygiene, not
# incident response: none of the advisories fixed between 42.0 and 50.0 is
# reachable from the APIs used here -- no x509, pkcs7, or pkcs12 is imported,
# and the only curve constructed is SECP256R1, never a SECT curve. The cost is
# real and accepted: cryptography dropped Intel-macOS and win32 wheels at
# 49.0.0, and pyOpenSSL <=26.2.0 caps cryptography below 49.
dependencies = [
    "cryptography>=50.0",
]
# No `License ::` classifier here: this project declares its license with the
# PEP 639 / setuptools>=77 SPDX form (`license = "Apache-2.0"` + `license-files`
# above), and pairing that with a classifier-form license is a build error, not
# a warning. Every string below was checked against PyPI's live classifier list
# (https://pypi.org/pypi?%3Aaction=list_classifiers) so none is invented.
# "3 - Alpha" is the honest status for a 0.1.0 release that has not been
# published to PyPI yet.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    # Justified by aitp_verifier/py.typed, which ships in the built wheel --
    # confirmed by unzipping dist/*.whl (see the CI wheel-smoke-test job).
    "Typing :: Typed",
]

[project.optional-dependencies]
# mypy is floored at its first cp314 release, not for an advisory (it has
# none) and not for a strict-mode change -- 1.10 and 1.20 both pass this
# config cleanly. It is so a lowest-resolution install works on 3.14.
dev = ["pytest>=9.0.3", "mypy>=1.18.1"]

[tool.setuptools.packages.find]
include = ["aitp_verifier*"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["aitp_verifier", "run_conformance.py", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
