name: Release

# Publishes `aitp-verifier` to PyPI with OIDC trusted publishing: no API token
# exists anywhere. The PyPI side (a pending publisher per index) is a one-time
# owner action; see scripts/handoff/pypi-trusted-publisher.md.
#
# * tag `v*` pushed      -> build, check, publish to PyPI (environment `pypi`).
# * workflow_dispatch    -> build, check, publish to TestPyPI (environment
#                           `testpypi`): the dry run before the first real tag.
# * pull_request         -> build and check only. Nothing is published.
#
# Every action is pinned by commit SHA: this workflow holds publish rights.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
      - aitp_verifier/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Fails closed: a tag that is not `v` + the pyproject version publishes
      # nothing. A non-tag run has no tag to compare.
      - name: Tag matches the pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match pyproject version $version (expected v$version)"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      # The installed wheel, from a neutral directory, answers the adapter's
      # init request: the package and its console script both work.
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          for cmd in "venv/bin/python -m aitp_verifier.adapter" "venv/bin/aitp-verifier-adapter"; do
            reply=$(printf '%s\n' '{"id":"req-1","op":"init","params":{"version":"1"}}' | $cmd)
            echo "$cmd -> $reply"
            printf '%s' "$reply" | venv/bin/python -c 'import json, sys; r = json.load(sys.stdin); assert r["ok"] and r["result"]["implementation"] == "aitp-verifier-py", r'
          done
          # The KAT keys ship in the wheel: no spec checkout is needed.
          env -u AITP_SPEC venv/bin/python -c 'from aitp_verifier.keys import load_packaged_kat_keys as k; n = len(k()); assert n >= 9, n; print(n, "packaged KAT keys")'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/aitp-verifier
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aitp-verifier
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
